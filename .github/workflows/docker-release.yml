name: Docker Release

# Builds a multi-platform Docker image and pushes it to GitHub Container Registry (GHCR).
#
# Triggers:
#   - push to main: publishes main, sha-<short>, and latest
#   - version tag / release: publishes semantic version tags
#   - workflow_dispatch: manual rebuild
#
# Image: ghcr.io/mattwag05/tutor
# Platforms: linux/amd64, linux/arm64

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GitHub is moving JavaScript actions from Node 20 to Node 24. Opt in now so
  # this release workflow fails early if any action is not Node 24 ready.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required for linux/arm64 cross-compilation on GitHub-hosted ubuntu runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Enable BuildKit with multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the release:
      #   type=semver strips the leading 'v' (v1.2.3 → 1.2.3)
      #   type=raw adds a 'latest' tag on every published release
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mattwag05/tutor
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass the release tag (e.g. "v1.2.3") into the Next.js build so the
          # sidebar version badge can show the running version at runtime.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # Use GitHub Actions cache to speed up repeated builds
          # mode=max caches all intermediate layers (frontend-builder and python-base are expensive)
          cache-from: type=gha
          cache-to: type=gha,mode=max
